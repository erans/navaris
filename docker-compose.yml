# All-in-one Navaris: Incus + Firecracker in a single container.
#
# Usage:
#   Incus only:              docker compose --profile default up
#   Incus + Firecracker:     docker compose --profile kvm up
#
# Requirements:
#   Docker Engine 25+, Docker Compose v2.15+
#   Firecracker requires /dev/kvm on the host (Linux with KVM support)

services:
  navaris:
    build:
      context: .
      dockerfile: Dockerfile
    # SECURITY: privileged grants all capabilities and disables seccomp/AppArmor.
    # Least-priv alternative (documented; keep privileged for now for compatibility):
    #   cap_add:
    #     - NET_ADMIN  # TAP device + iptables for Firecracker/Incus networking
    #     - SYS_ADMIN  # mount, btrfs loop, namespace setup
    #     - MKNOD      # loop device creation for btrfs CoW tests
    #   security_opt:
    #     - no-new-privileges:true
    #   # For Incus also needs: cgroup: host (already set) + devices or cgroup permissions.
    #   # For Firecracker also needs: devices: [/dev/kvm] (already set) + /dev/net/tun if used.
    # To harden: replace privileged with the above caps when host supports it,
    # and test with: docker compose --profile ... up --force-recreate
    privileged: true
    cgroup: host
    ports:
      - "${NAVARIS_HOST_PORT:-8080}:8080"
    environment:
      NAVARIS_AUTH_TOKEN: ${NAVARIS_AUTH_TOKEN:-}
      NAVARIS_LOG_LEVEL: ${NAVARIS_LOG_LEVEL:-info}
      INCUS_PRELOAD_IMAGE: ${INCUS_PRELOAD_IMAGE:-images:alpine/3.21,images:debian/12}
      NAVARIS_UI_PASSWORD: ${NAVARIS_UI_PASSWORD:-}
      NAVARIS_UI_SESSION_KEY: ${NAVARIS_UI_SESSION_KEY:-}
      NAVARIS_UI_SESSION_TTL: ${NAVARIS_UI_SESSION_TTL:-24h}
    volumes:
      - navaris-data:/var/lib/navaris
      - incus-data:/var/lib/incus
      - firecracker-data:/srv/firecracker
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    profiles:
      - default

  navaris-kvm:
    extends:
      service: navaris
    devices:
      - /dev/kvm:/dev/kvm
    profiles:
      - kvm

volumes:
  navaris-data:
  incus-data:
  firecracker-data:
