services:
  navarisd:
    build:
      context: .
      dockerfile: Dockerfile.navarisd-firecracker
    # SECURITY: privileged grants all capabilities and disables seccomp/AppArmor.
    # Least-priv alternative (documented; keep privileged for now for compatibility):
    #   cap_add:
    #     - NET_ADMIN  # TAP device + iptables for Firecracker/Incus networking
    #     - SYS_ADMIN  # mount, btrfs loop, namespace setup
    #     - MKNOD      # loop device creation for btrfs CoW tests
    #   security_opt:
    #     - no-new-privileges:true
    #   # For Incus also needs: cgroup: host (already set) + devices or cgroup permissions.
    #   # For Firecracker also needs: devices: [/dev/kvm] (already set) + /dev/net/tun if used.
    # To harden: replace privileged with the above caps when host supports it,
    # and test with: docker compose --profile ... up --force-recreate
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    command:
      - --listen=:8080
      - --db-path=/tmp/navaris.db
      - --firecracker-bin=/usr/local/bin/firecracker
      - --jailer-bin=/usr/local/bin/jailer
      - --kernel-path=/opt/firecracker/vmlinux
      - --image-dir=/opt/firecracker/images
      - --chroot-base=/srv/firecracker
      - --snapshot-dir=/srv/firecracker/snapshots
      - --enable-jailer=false
      - --auth-token=test-token
      - --log-level=debug
      - --firecracker-vcpu-headroom-mult=2.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--header",
             "Authorization: Bearer test-token",
             "http://localhost:8080/v1/health"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  navarisd-dev:
    extends:
      service: navarisd
    ports:
      - "${NAVARIS_HOST_PORT:-8080}:8080"
    profiles:
      - dev

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      NAVARIS_API_URL: http://navarisd:8080
      NAVARIS_TOKEN: test-token
      NAVARIS_BASE_IMAGE: ${NAVARIS_BASE_IMAGE:-alpine-3.21}
      NAVARIS_CLI: /usr/local/bin/navaris
    depends_on:
      navarisd:
        condition: service_healthy
    profiles:
      - test
